name: Dev Branch Prerelease

on:
  push:
    branches:
      - dev
      - dev/**

permissions:
  contents: write

jobs:
  prerelease:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test with Maven
        run: mvn -B clean package

      - name: Resolve artifact metadata
        id: meta
        run: |
          VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          ARTIFACT_ID=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.artifactId)
          BRANCH_NAME="${GITHUB_REF_NAME//\//-}"
          SHORT_SHA=${GITHUB_SHA::7}
          TAG_NAME="dev-${BRANCH_NAME}-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          JAR_NAME="${ARTIFACT_ID}-${VERSION}-${BRANCH_NAME}-${GITHUB_RUN_NUMBER}-${SHORT_SHA}.jar"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "artifact_id=${ARTIFACT_ID}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "jar_name=${JAR_NAME}" >> "$GITHUB_OUTPUT"

      - name: Prepare versioned JAR
        run: |
          mkdir -p dist
          cp "target/${{ steps.meta.outputs.artifact_id }}-${{ steps.meta.outputs.version }}.jar" "dist/${{ steps.meta.outputs.jar_name }}"

      - name: Upload prerelease artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.jar_name }}
          path: dist/${{ steps.meta.outputs.jar_name }}
          if-no-files-found: error

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: Dev Prerelease ${{ steps.meta.outputs.tag_name }}
          prerelease: true
          generate_release_notes: true
          files: dist/${{ steps.meta.outputs.jar_name }}
