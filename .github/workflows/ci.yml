name: Java CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test with Maven
        run: mvn -B clean package

      - name: Resolve project metadata
        id: meta
        run: |
          VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          ARTIFACT_ID=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.artifactId)
          SHORT_SHA=${GITHUB_SHA::7}
          VERSIONED_NAME="${ARTIFACT_ID}-${VERSION}-${GITHUB_RUN_NUMBER}-${SHORT_SHA}.jar"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "artifact_id=${ARTIFACT_ID}" >> "$GITHUB_OUTPUT"
          echo "versioned_name=${VERSIONED_NAME}" >> "$GITHUB_OUTPUT"

      - name: Prepare versioned JAR
        run: |
          mkdir -p dist
          cp "target/${{ steps.meta.outputs.artifact_id }}-${{ steps.meta.outputs.version }}.jar" "dist/${{ steps.meta.outputs.versioned_name }}"

      - name: Upload versioned JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.versioned_name }}
          path: dist/${{ steps.meta.outputs.versioned_name }}
          if-no-files-found: error
